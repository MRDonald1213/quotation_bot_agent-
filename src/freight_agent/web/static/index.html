<!DOCTYPE html>
<html lang="en" data-theme="freight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freight AI Agent</title>
<script>try{const t=localStorage.getItem('freight-theme');if(t==='freight'||t==='freight-dark')document.documentElement.dataset.theme=t;}catch{}</script>
<link rel="stylesheet" href="/static/tailwind.generated.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="shell">
  <header class="app-header navbar bg-base-100">
    <a class="brand" href="#/" aria-label="Freight AI Agent dashboard">Freight <span>AI Agent</span></a>
    <nav id="nav" class="app-navigation" aria-label="Application navigation">
      <ul class="menu menu-horizontal primary-nav" aria-label="Core navigation">
        <li><a href="#/">Dashboard</a></li>
        <li><a href="#/quotations">Quotations</a></li>
        <li><a href="#/inbox">Mailbox</a></li>
        <li><a href="#/drafts">Drafts <span id="drafts-count" class="badge badge-xs badge-primary" aria-label="No pending drafts" hidden></span></a></li>
        <li><a href="#/suppliers">Suppliers</a></li>
        <li><a href="#/comparison">Comparison</a></li>
        <li class="nav-secondary-item"><a href="#/archived">Archived</a></li>
      </ul>
      <div class="header-utilities" aria-label="Account and utilities">
        <a class="btn btn-ghost btn-sm utility-link" href="#/notifications" aria-label="Notifications">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0a3 3 0 0 1-6 0m6 0H9"/></svg>
          <span class="utility-label">Notifications</span><span id="notification-count" class="badge badge-xs badge-primary" aria-live="polite"></span>
        </a>
        <a class="btn btn-ghost btn-sm utility-link" href="#/settings" aria-label="Settings">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.8a1.8 1.8 0 0 1 0-3.6H4a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0V4a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6H20a1.8 1.8 0 0 0-.6 1Z"/></svg>
          <span class="utility-label">Settings</span>
        </a>
        <span class="utility-divider" aria-hidden="true"></span>
        <button class="btn btn-ghost btn-sm utility-link sign-out" id="logout" aria-label="Sign out">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5m5 5H3"/></svg>
          <span class="utility-label">Sign out</span>
        </button>
        <button class="btn btn-ghost btn-sm theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch theme"><span aria-hidden="true" id="theme-glyph">☾</span><span class="theme-label">Dark mode</span></button>
      </div>
    </nav>
    <div class="system" id="system" aria-live="polite"></div>
  </header>

  <main id="main-content" tabindex="-1">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <p class="guide" id="page-guide"></p>
    </div>
    <div id="view"></div>
  </main>
</div>

<button class="btn btn-primary assistant-fab" id="open-assistant" aria-label="Open Supplier Assistant" title="Open Supplier Assistant"><span aria-hidden="true">✦</span><span class="assistant-fab-label">Ask Freight AI</span></button>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="actions">
      <button class="btn neutral" id="modal-cancel">Cancel</button>
      <button class="btn" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>
<script src="/static/api.js"></script>
<script src="/static/pages/workspace.js"></script>
<script src="/static/pages/intake.js"></script>
<script src="/static/pages/comparison.js"></script>
<script src="/static/pages/draft.js"></script>
<script src="/static/pages/connections.js"></script>
<script src="/static/pages/settings.js"></script>
<script src="/static/pages/notifications.js"></script>
<script src="/static/pages/assistant.js"></script>
<script src="/static/pages/suppliers.js"></script>
<script src="/static/daisy-components.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
